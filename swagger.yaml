definitions:
  UserCreate:
    required:
    - full_name
    - email
    - password
    - password2
    type: object
    properties:
      full_name:
        title: Full name
        type: string
        maxLength: 150
        minLength: 1
      email:
        title: Email
        type: string
        format: email
        maxLength: 255
        minLength: 1
      profile_pic:
        title: Profile pic
        type: string
        readOnly: true
        x-nullable: true
        format: uri
      dob:
        title: Dob
        type: string
        format: date
        x-nullable: true
      password:
        title: Password
        type: string
        minLength: 1
      password2:
        title: Password2
        type: string
        minLength: 1
  Book:
    required:
    - title
    - discription
    - price
    - book_type
    - publisher
    - language
    - dimensions
    - stock_quantity
    - amazon_url
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      uid:
        title: Uid
        type: string
        format: uuid
        readOnly: true
        x-nullable: true
      title:
        title: Title
        type: string
        maxLength: 200
        minLength: 1
      discription:
        title: Discription
        type: string
        minLength: 1
      price:
        title: Price
        type: string
        format: decimal
      book_type:
        title: Book type
        type: string
        maxLength: 50
        minLength: 1
      publisher:
        title: Publisher
        type: string
        maxLength: 100
        minLength: 1
      language:
        title: Language
        type: string
        maxLength: 30
        minLength: 1
      dimensions:
        title: Dimensions
        type: string
        maxLength: 50
        minLength: 1
      stock_quantity:
        title: Stock quantity
        type: integer
        maximum: 9223372036854775807
        minimum: -9223372036854775808
      amazon_url:
        title: Amazon url
        type: string
        format: uri
        maxLength: 200
        minLength: 1
      cover_image:
        title: Cover image
        type: string
        readOnly: true
        x-nullable: true
        format: uri
  GuardianList:
    required:
    - codename
    - name
    - age
    - nationality
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      codename:
        title: Codename
        type: string
        maxLength: 50
        minLength: 1
      name:
        title: Name
        type: string
        maxLength: 100
        minLength: 1
      age:
        title: Age
        type: integer
        maximum: 9223372036854775807
        minimum: -9223372036854775808
      nationality:
        title: Nationality
        type: string
        maxLength: 50
        minLength: 1
      profile_photo:
        title: Profile photo
        type: string
        readOnly: true
        x-nullable: true
        format: uri
      gadget:
        title: Gadget
        type: string
        readOnly: true
  ProductAttribute:
    required:
    - name
    - value
    type: object
    properties:
      name:
        title: Name
        type: string
        maxLength: 100
        minLength: 1
      value:
        title: Value
        type: string
        maxLength: 255
        minLength: 1
  Product:
    required:
    - title
    - price
    - stock_quantity
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      uid:
        title: Uid
        type: string
        format: uuid
        readOnly: true
        x-nullable: true
      title:
        title: Title
        type: string
        maxLength: 255
        minLength: 1
      subtitle:
        title: Subtitle
        type: string
        maxLength: 255
        x-nullable: true
      description:
        title: Description
        type: string
      price:
        title: Price
        type: string
        format: decimal
      image:
        title: Image
        type: string
        readOnly: true
        format: uri
      category:
        title: Category
        type: string
        enum:
        - gear
        - other
        x-nullable: true
      stock_quantity:
        title: Stock quantity
        type: integer
        maximum: 9223372036854775807
        minimum: -9223372036854775808
      data:
        title: Data
        type: object
      attrs:
        type: array
        items:
          $ref: '#/definitions/ProductAttribute'
        readOnly: true
      created_at:
        title: Created at
        type: string
        format: date-time
        readOnly: true
  GuardianDetail:
    required:
    - name
    - age
    - about
    - nationality
    - roll_number
    - personality
    - strengths
    - weaknesses
    - aspirational_angle
    - codename
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      gadget:
        $ref: '#/definitions/Product'
      name:
        title: Name
        type: string
        maxLength: 100
        minLength: 1
      age:
        title: Age
        type: integer
        maximum: 9223372036854775807
        minimum: -9223372036854775808
      about:
        title: About
        type: string
        minLength: 1
      profile_photo:
        title: Profile photo
        type: string
        readOnly: true
        x-nullable: true
        format: uri
      nationality:
        title: Nationality
        type: string
        maxLength: 50
        minLength: 1
      roll_number:
        title: Roll number
        type: string
        maxLength: 20
        minLength: 1
      personality:
        title: Personality
        type: string
        maxLength: 100
        minLength: 1
      strengths:
        title: Strengths
        type: string
        maxLength: 200
        minLength: 1
      weaknesses:
        title: Weaknesses
        type: string
        maxLength: 200
        minLength: 1
      aspirational_angle:
        title: Aspirational angle
        type: string
        maxLength: 200
        minLength: 1
      codename:
        title: Codename
        type: string
        maxLength: 50
        minLength: 1
  Poll:
    required:
    - question
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      question:
        title: Question
        type: string
        maxLength: 255
        minLength: 1
      options:
        title: Options
        type: string
        readOnly: true
      created_at:
        title: Created at
        type: string
        format: date-time
        readOnly: true
  Video:
    required:
    - title
    - video_type
    - duration
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      title:
        title: Title
        type: string
        maxLength: 255
        minLength: 1
      subtitle:
        title: Subtitle
        type: string
        maxLength: 255
      video_type:
        title: Video type
        type: string
        enum:
        - trailer
        - preview
        - episode
      duration:
        title: Duration
        type: string
        maxLength: 10
        minLength: 1
      video_file:
        title: Video file
        type: string
        readOnly: true
        format: uri
      thumbnail:
        title: Thumbnail
        type: string
        readOnly: true
        format: uri
