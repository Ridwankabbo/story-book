      description: |-
        POST body:
        {
          "order_type": "book" | "product",
          "id": 12,                 # Book id or Product id
          "quantity": 1,
          "customer_name": "Riyad",
          "email": "test@test.com",
          "address": "Dhaka",
          "city": "Dhaka",
          "country": "Bangladesh"
